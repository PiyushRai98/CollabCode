version: "3.9"

services:
  mongodb:
    image: mongo:latest
    container_name: realtime-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest
    container_name: realtime-redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
    container_name: realtime-server
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - mongodb
      - redis

  client:
    build:
      context: ./client
    container_name: realtime-client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongodb_data: